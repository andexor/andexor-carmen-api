[project]
name = "andexor-carmen-api"
version = "1.0.0"
description = "Andexor Carmen API"
requires-python = ">=3.14"
dependencies = [
    "fastapi<0.164",
    "parsedatetime>=2.6",
    "tzdata>=2026.6",
]

[dependency-groups]
dev = [
    "workers-py",
    "workers-runtime-sdk",
    "pip-licenses",
    "openapi-spec-validator>=0.9.0",
    "jsonschema>=4.26.0",
]

[tool.uv]
exclude-newer = "1 week"
